info:
    description: Compact provider-native LLM gateway with provider-aware routing, capability filtering, quota enforcement, SSE streaming, and provider-specific passthrough fields.
    title: llmgw
    version: v1
openapi: 3.0.3
paths:
    /docs:
        get:
            operationId: docsRedirect
            responses:
                "301":
                    description: Redirects to /docs/index.html.
            security:
                - bearerAuth: []
            summary: Redirect to Swagger UI
            tags:
                - docs
    /docs/index.html:
        get:
            operationId: docs
            responses:
                "200":
                    content:
                        text/html:
                            schema:
                                type: string
                    description: Swagger UI backed by /openapi.json.
            security:
                - bearerAuth: []
            summary: Swagger UI
            tags:
                - docs
    /healthz:
        get:
            operationId: healthz
            responses:
                "200":
                    content:
                        application/json:
                            example:
                                ok: true
                            schema:
                                properties:
                                    ok:
                                        type: boolean
                                type: object
                    description: Gateway process is alive.
            summary: Liveness probe
            tags:
                - system
    /metrics:
        get:
            operationId: metrics
            responses:
                "200":
                    content:
                        text/plain:
                            schema:
                                type: string
                    description: Prometheus exposition format.
            security:
                - bearerAuth: []
            summary: Prometheus metrics
            tags:
                - system
    /openapi.json:
        get:
            operationId: openapiJSON
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                additionalProperties: true
                                type: object
                    description: Live OpenAPI document for the gateway surface.
            security:
                - bearerAuth: []
            summary: Generated OpenAPI JSON
            tags:
                - docs
    /openapi.yaml:
        get:
            operationId: openapiYAML
            responses:
                "200":
                    content:
                        application/yaml:
                            schema:
                                type: string
                        text/yaml:
                            schema:
                                type: string
                    description: Live OpenAPI document for the gateway surface.
            security:
                - bearerAuth: []
            summary: Generated OpenAPI YAML
            tags:
                - docs
    /readyz:
        get:
            operationId: readyz
            responses:
                "200":
                    content:
                        application/json:
                            example:
                                ready: true
                            schema:
                                properties:
                                    ready:
                                        type: boolean
                                type: object
                    description: Configuration is loaded and ready.
                "503":
                    content:
                        application/json:
                            example:
                                error:
                                    code: not_ready
                                    message: configuration not loaded
                                    type: server_error
                            schema:
                                properties:
                                    error:
                                        properties:
                                            code:
                                                type: string
                                            message:
                                                type: string
                                            param:
                                                type: string
                                            type:
                                                type: string
                                        type: object
                                type: object
                    description: Configuration has not been loaded yet.
            summary: Readiness probe
            tags:
                - system
    /v1beta/models/{model}:embedContent:
        post:
            description: Gemini-native endpoint. Requests are routed only to Gemini routes and are not translated across provider families.
            operationId: geminiEmbedContentV1Beta
            parameters:
                - in: path
                  name: model
                  required: true
                  schema:
                    description: Gemini model id from the native URL path.
                    example: gemini-embedding-2
                    type: string
            requestBody:
                content:
                    application/json:
                        example:
                            content:
                                parts:
                                    - text: gateway
                        schema:
                            additionalProperties: true
                            properties:
                                content:
                                    additionalProperties: true
                                    type: object
                            required:
                                - content
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            example:
                                embedding:
                                    values:
                                        - 0.1
                                        - 0.2
                                usageMetadata:
                                    promptTokenCount: 1
                                    totalTokenCount: 1
                            schema:
                                additionalProperties: true
                                type: object
                    description: Gemini-native embedContent response.
                default:
                    content:
                        application/json:
                            example:
                                error:
                                    code: 400
                                    message: invalid request
                                    status: INVALID_ARGUMENT
                            schema:
                                properties:
                                    error:
                                        properties:
                                            code:
                                                type: integer
                                            message:
                                                type: string
                                            status:
                                                type: string
                                        type: object
                                type: object
                    description: Google API error response.
            security:
                - bearerAuth: []
                - geminiGatewayKey: []
            summary: Gemini embedContent (v1beta)
            tags:
                - provider
    /v1beta/models/{model}:generateContent:
        post:
            description: Gemini-native endpoint. Requests are routed only to Gemini routes and are not translated across provider families.
            operationId: geminiGenerateContentV1Beta
            parameters:
                - in: path
                  name: model
                  required: true
                  schema:
                    description: Gemini model id from the native URL path.
                    example: gemini-2.5-flash
                    type: string
            requestBody:
                content:
                    application/json:
                        example:
                            contents:
                                - parts:
                                    - text: Say hello in one sentence.
                                  role: user
                        schema:
                            additionalProperties: true
                            properties:
                                contents:
                                    items:
                                        additionalProperties: true
                                        type: object
                                    type: array
                                generationConfig:
                                    additionalProperties: true
                                    type: object
                                tools:
                                    items:
                                        additionalProperties: true
                                        type: object
                                    type: array
                            required:
                                - contents
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            example:
                                candidates:
                                    - index: 0
                                responseId: resp_1
                            schema:
                                additionalProperties: true
                                type: object
                    description: Gemini-native generateContent response.
                default:
                    content:
                        application/json:
                            example:
                                error:
                                    code: 400
                                    message: invalid request
                                    status: INVALID_ARGUMENT
                            schema:
                                properties:
                                    error:
                                        properties:
                                            code:
                                                type: integer
                                            message:
                                                type: string
                                            status:
                                                type: string
                                        type: object
                                type: object
