            security:
                - bearerAuth: []
                - geminiGatewayKey: []
            summary: Gemini generateContent (v1beta)
            tags:
                - provider
    /v1beta/models/{model}:streamGenerateContent:
        post:
            description: Gemini-native SSE endpoint. The gateway preserves provider events while tracking final usage.
            operationId: geminiStreamGenerateContentV1Beta
            parameters:
                - in: path
                  name: model
                  required: true
                  schema:
                    description: Gemini model id from the native URL path.
                    example: gemini-2.5-flash
                    type: string
            requestBody:
                content:
                    application/json:
                        example:
                            contents:
                                - parts:
                                    - text: Count to three.
                                  role: user
                        schema:
                            additionalProperties: true
                            properties:
                                contents:
                                    items:
                                        additionalProperties: true
                                        type: object
                                    type: array
                                generationConfig:
                                    additionalProperties: true
                                    type: object
                                tools:
                                    items:
                                        additionalProperties: true
                                        type: object
                                    type: array
                            required:
                                - contents
                            type: object
                required: true
            responses:
                "200":
                    content:
                        text/event-stream:
                            example: |+
                                data: {"candidates":[{"index":0,"content":{"parts":[{"text":"hello"}]},"finishReason":"STOP"}],"usageMetadata":{"promptTokenCount":1,"candidatesTokenCount":1,"totalTokenCount":2}}

                            schema:
                                type: string
                    description: Gemini-native SSE stream.
                default:
                    content:
                        application/json:
                            example:
                                error:
                                    code: 400
                                    message: invalid request
                                    status: INVALID_ARGUMENT
                            schema:
                                properties:
                                    error:
                                        properties:
                                            code:
                                                type: integer
                                            message:
                                                type: string
                                            status:
                                                type: string
                                        type: object
                                type: object
                    description: Google API error response.
            security:
                - bearerAuth: []
                - geminiGatewayKey: []
            summary: Gemini streamGenerateContent (v1beta)
            tags:
                - provider
